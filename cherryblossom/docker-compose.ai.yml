services:
  # Ollama version policy: ollama-mgmt and ollama-3090 SHARE the ollama-data
  # model store, so they must run the SAME version. Both are pinned to an
  # explicit tag. With the shared :latest tag, watchtower (enabled on
  # ollama-mgmt only) moved the tag under the running 3090, which then jumped
  # 0.34.4 -> 0.40.15 on its next restart and crash-looped on the models mount.
  # Bump both tags together, deliberately.
  ollama-mgmt:
    image: ollama/ollama:0.40.15
    volumes:
    - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    ports:
    - 127.0.0.1:11434:11434

  ollama-3090:
    image: ollama/ollama:0.40.15   # keep in lockstep with ollama-mgmt
    profiles: ["gpu-3090"]
    volumes:
    # rw (not :ro): Ollama >= 0.40 writes/cleans `manifests-v2` in the models
    # dir on startup and exits 1 on a read-only mount (0.34.4 tolerated :ro).
    - ollama-data:/ollama-models
    deploy:
      resources:
        limits:
          cpus: '8.00'
          memory: 30G
        reservations:
          cpus: '0.50'
          memory: 1G
          devices:
          - driver: nvidia
            device_ids: ['0']
            capabilities:
            - gpu
    environment:
      OLLAMA_MODELS: /ollama-models/models
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_GPU: 999
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      # Match the context_length Hermes/Open WebUI declare for gpt-oss:20b
      # (131072). Without this Ollama's VRAM-based default caps it at 32k and
      # silently truncates longer conversations. Models that pin num_ctx in
      # their Modelfile (qwen3.8-tuned:*) keep their own value.
      OLLAMA_CONTEXT_LENGTH: 131072
      # llama-server --fit keeps this much VRAM free (MiB). Ollama's default
      # margin (~1.9 GiB) spills 4 layers of qwen3.8 at 100k ctx to the CPU.
      LLAMA_ARG_FIT_TARGET: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


  # Video generation (LTX-2.3 GGUF). Opt-in profile: needs the 3090 to itself,
  # so it is not started by a plain `compose up`.
  comfyui-init:
    image: alpine/git:latest
    profiles: ["video"]
    volumes:
    - comfyui-data:/data
    - ./comfy-provision.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M

  comfyui:
    image: yanwk/comfyui-boot:cu130-slim-20260921
    profiles: ["video"]
    depends_on:
      comfyui-init:
        condition: service_completed_successfully
    # If the host ever runs out of RAM anyway, the kernel kills ComfyUI first
    # (a render is disposable; Forge, Jellyfin and the desktop are not).
    oom_score_adj: 900
    volumes:
    - comfyui-data:/root
    environment:
      # --cache-none: drop models once no later node needs them. The 17G cap keeps
      # an overrun inside this container instead of a host-wide OOM (31G host;
      # the LTX Gemma text encoder alone dequantizes to ~12G).
      CLI_ARGS: --cache-none
    # No published port: the UI and API are reached through ollama-gateway
    # (127.0.0.1:8188), whose comfy_filter takes a gpu-yield lease per prompt.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8.00'
          memory: 17G
        reservations:
          cpus: '0.50'
          memory: 1G
          devices:
          - driver: nvidia
            device_ids: ['0']
            capabilities:
            - gpu

  # Unloads the Ollama model around Forge generations (see forge_filter.lua).
  gpu-yield:
    image: python:3.12-slim
    command: ["python", "/app/gpu_yield.py"]
    volumes:
    - ./gpu-yield/gpu_yield.py:/app/gpu_yield.py:ro
    environment:
      OLLAMA: http://ollama-3090:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11500/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  searxng:
    image: searxng/searxng:latest
    volumes:
    - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    restart: unless-stopped
    labels:
      # Engine scrapers break as sites change; stale images silently return junk.
      com.centurylinklabs.watchtower.enable: 'true'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  forge-init:
    image: alpine/git:latest
    volumes:
    - sd-data:/data
    - ./sd-provision.sh:/provision.sh:ro
    environment:
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
    entrypoint: ["/bin/sh", "/provision.sh"]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M

  # Forge Neo (maintained Forge fork): A1111-compatible API on :17860, reached
  # by Open WebUI through ollama-gateway (forge_filter.lua). Checkpoints and
  # LoRAs come read-only from sd-data; Neo's own state lives in forge-neo-data.
  forge:
    build:
      context: ./forge-neo
    image: forge-neo:local
    depends_on:
      forge-init:
        condition: service_completed_successfully
    volumes:
    - type: volume
      source: sd-data
      target: /models/ckpt
      volume:
        subpath: stable_diffusion/models/ckpt
      read_only: true
    - type: volume
      source: sd-data
      target: /models/lora
      volume:
        subpath: stable_diffusion/models/lora
      read_only: true
    - forge-neo-data:/data
    deploy:
      resources:
        limits:
          cpus: '8.00'
          memory: 20G
        reservations:
          cpus: '0.50'
          memory: 2G
          devices:
          - driver: nvidia
            device_ids: ['0']
            capabilities:
            - gpu
    # gpu-yield frees Forge's RAM with /sdapi/v1/server-kill; this brings it back.
    restart: unless-stopped
  open-webui:
    image: open-webui:local
    build:
      context: ./open-webui
    environment:
      # --- Core ---
      RESET_CONFIG_ON_START: 'true'
      OLLAMA_BASE_URL: http://ollama-gateway:11434
      WEBUI_URL: https://gpu.k5m.sh
      WEBUI_AUTH: 'true'
      WEBUI_SESSION_COOKIE_SECURE: 'true'
      WEBUI_SESSION_COOKIE_SAME_SITE: none
      ENABLE_SIGNUP: 'false'
      ENABLE_API_KEYS: 'true'
      TASK_MODEL: gpt-oss:20b
      DEFAULT_MODELS: gpt-oss:20b
      # --- Image generation (Forge on 3090; model routing via the template in .env) ---
      ENABLE_IMAGE_GENERATION: 'true'
      ENABLE_IMAGE_PROMPT_GENERATION: 'true'
      IMAGE_GENERATION_ENGINE: automatic1111
      IMAGE_GENERATION_MODEL: sd_xl_base_1.0.safetensors
      AUTOMATIC1111_BASE_URL: http://ollama-gateway:17860
      AUTOMATIC1111_PARAMS: '{"sampler_name": "DPM++ 2M SDE", "scheduler": "Karras", "cfg_scale": 7.0}'
      IMAGE_SIZE: 1216x832
      IMAGE_STEPS: 25
      # Template text (NSFW model routing, prompt rules) lives in .env on the host.
      IMAGE_PROMPT_GENERATION_PROMPT_TEMPLATE: ${IMAGE_PROMPT_GENERATION_PROMPT_TEMPLATE:-}
      # --- Search ---
      ENABLE_WEB_SEARCH: 'true'
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_TRUST_ENV: 'true'
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      # --- Code interpreter (Jupyter on 1080 Ti) ---
      ENABLE_CODE_EXECUTION: 'true'
      ENABLE_CODE_INTERPRETER: 'true'
      CODE_EXECUTION_ENGINE: jupyter
      CODE_EXECUTION_JUPYTER_URL: http://jupyter:8888
      CODE_EXECUTION_JUPYTER_AUTH: token
      CODE_EXECUTION_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN:-changeme}
      CODE_EXECUTION_JUPYTER_TIMEOUT: '120'
      CODE_INTERPRETER_ENGINE: jupyter
      CODE_INTERPRETER_JUPYTER_URL: http://jupyter:8888
      CODE_INTERPRETER_JUPYTER_AUTH: token
      CODE_INTERPRETER_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN:-changeme}
      CODE_INTERPRETER_JUPYTER_TIMEOUT: '120'
    volumes:
    - open-webui-data:/app/backend/data
    ports:
    - 127.0.0.1:3100:8080
    restart: unless-stopped
    depends_on:
      ollama-gateway:
        condition: service_healthy
      searxng:
        condition: service_healthy
      forge:
        condition: service_healthy
      jupyter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G
        reservations:
          cpus: '0.10'
          memory: 128M
    labels:
      com.centurylinklabs.watchtower.enable: 'false'

  jupyter:
    image: quay.io/jupyter/pytorch-notebook:cuda12-latest
    command:
    - start-notebook.py
    - --IdentityProvider.token=${JUPYTER_TOKEN:-changeme}
    - --ServerApp.allow_origin=*
    - --ServerApp.root_dir=/home/jovyan/workspace
    volumes:
    - /mnt/jupyter-workspace:/home/jovyan/workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: '0'
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: token ${JUPYTER_TOKEN:-changeme}\" http://localhost:8888/api > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 8G
        reservations:
          cpus: '0.25'
          memory: 512M
          devices:
          - driver: nvidia
            device_ids: ['0']
            capabilities:
            - gpu

  ollama-gateway:
    image: envoyproxy/envoy:v1.32-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--concurrency", "1"]
    volumes:
    - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    - ./filter.lua:/etc/envoy/filter.lua:ro
    - ./forge_filter.lua:/etc/envoy/forge_filter.lua:ro
    - ./comfy_filter.lua:/etc/envoy/comfy_filter.lua:ro
    ports:
    - 127.0.0.1:8188:18188
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9901'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M

  hermes-agent:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    image: hermes-agent:local
    command: ["gateway", "run"]
    configs:
      # gh reads this; git gets credentials through gh (GIT_CONFIG_* below).
      # Hermes strips GH_TOKEN from every child process by policy, so the
      # token reaches gh/git as a file instead of an env var.
      - source: hermes-gh-hosts
        target: /workspace/.config/gh/hosts.yml
    volumes:
      - ./hermes/home:/opt/data
      # Managed scope: repo-owned base config overlaid (and locked) on the live
      # /opt/data/config.yaml. See hermes/managed/config.yaml.
      - ./hermes/managed:/etc/hermes:ro
      - ./hermes/workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock:rw
    environment:
      TZ: America/New_York
      HERMES_HOME: /opt/data
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: "552924730894712833"
      GH_TOKEN: ${GH_TOKEN:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      DIGITALOCEAN_ACCESS_TOKEN: ${DIGITALOCEAN_ACCESS_TOKEN:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOG_KEYRING_BACKEND: file
      GOG_KEYRING_PASSWORD: openclaw
      XDG_CONFIG_HOME: /workspace/.config
      # credential.helper: reset inherited helpers (empty value), then use gh.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: "!gh auth git-credential"
      # s6-supervised dashboard/serve backend on :9119 for the mobile app.
      # Non-loopback bind requires an auth provider: basic auth from .env.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
    group_add:
      - "965"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      ollama-gateway:
        condition: service_healthy
    healthcheck:
      # Run as hermes, not root: `hermes status` takes leases in /opt/data/installs,
      # and root-owned leases lock the real (uid 1000) process out → crash loop.
      test: ["CMD-SHELL", "HOME=/opt/data /command/s6-setuidgid hermes /opt/hermes/.venv/bin/hermes status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.05'
          memory: 64M

configs:
  hermes-gh-hosts:
    content: |
      github.com:
          oauth_token: ${GH_TOKEN}
          git_protocol: https
          user: khayyamsaleem

volumes:
  comfyui-data:
  forge-neo-data:
  ollama-data:
    external: true
    name: open-claw_ollama-data
  open-webui-data:
  sd-data:
