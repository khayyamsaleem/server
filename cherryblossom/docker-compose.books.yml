services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/New_York
    volumes:
    - calibre-web-automated-config:/config
    # Ingest dir: anything landing here is imported into the library, then removed.
    # Shelfmark writes its finished downloads here.
    - /mnt/jellydrive-01/books/ingest:/cwa-book-ingest
    - /mnt/jellydrive-01/books/library:/calibre-library
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/login > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G
        reservations:
          cpus: '0.10'
          memory: 256M

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    # Egress through the VPN, like transmission and prowlarr. Without this
    # shelfmark's own fetches (Anna's Archive et al) leave over the host IP.
    network_mode: container:gluetun
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/New_York
    # Search via the existing Prowlarr (same netns, hence localhost).
    - PROWLARR_ENABLED=true
    - PROWLARR_URL=http://localhost:9696
    - PROWLARR_API_KEY=${PROWLARR_API_KEY}
    - PROWLARR_INDEXER_TIMEOUT=90
    # Hand torrents to the existing transmission behind the VPN.
    - PROWLARR_TORRENT_CLIENT=transmission
    - TRANSMISSION_URL=http://localhost:9091
    - TRANSMISSION_USERNAME=${TRANSMISSION_USER}
    - TRANSMISSION_PASSWORD=${TRANSMISSION_PASS}
    - TRANSMISSION_CATEGORY=books
    # Must resolve identically in both containers (see the /downloads bind below).
    - TRANSMISSION_DOWNLOAD_DIR=/downloads/books
    # Keep the internal Cloudflare-bypass browser warm between searches.
    # Upstream default (180s) shuts it down after 3 min idle, so each session
    # pays a cold browser start. Upstream advises against the external
    # bypasser (slower + less reliable), so tune the internal one instead.
    - BYPASS_BROWSER_IDLE_TIMEOUT=1800
    # flaresolverr is in this same netns. Unused while USING_EXTERNAL_BYPASSER
    # is false, but wrong-by-default is a trap.
    - EXT_BYPASSER_URL=http://localhost:8191
    # Anna's Archive mirrors, tried in order with failover (AA_BASE_URL=auto).
    # All three verified solvable through byparr on 2026-08-22.
    - AA_BASE_URL=auto
    - AA_MIRROR_URLS=https://annas-archive.gd,https://annas-archive.gl,https://annas-archive.pk
    volumes:
    - shelfmark-config:/config
    # Default download destination -> CWA's ingest dir, so finished books
    # are imported into the Calibre library automatically.
    - /mnt/jellydrive-01/books/ingest:/books
    # Must match transmission's /downloads bind exactly so Shelfmark can
    # resolve completed torrent paths reported by the download client.
    - /mnt/jellydrive-01/jellyfin_media:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
      calibre-web-automated:
        condition: service_healthy
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/api/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          cpus: '0.05'
          memory: 128M

volumes:
  calibre-web-automated-config:
  shelfmark-config:
