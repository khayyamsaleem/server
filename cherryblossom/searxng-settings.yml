# Keep SearXNG's default engine definitions but only these engines (listing an
# engine under `engines:` merges settings, it does not enable it; there is no
# `enabled_engines` option). Brave gives the best results from this IP. Google,
# DuckDuckGo and Startpage often CAPTCHA/silently block it but spread the load
# when they work; SearXNG suspends a blocked engine automatically. Bing is left
# out: its scraper returns unrelated front pages (checked 2026.9.25).
use_default_settings:
  engines:
    keep_only:
      - google
      - duckduckgo
      - brave
      - startpage
      - wikipedia

server:
  limiter: false
  secret_key: "66d19e14d9aa86d74d18e4a1cb60d0a48f401d907ca527eb76816929b9f5be5d"

search:
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    use_http2: true
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: brave
    engine: brave
    shortcut: br
  - name: wikipedia
    engine: wikipedia
    shortcut: wp

outgoing:
  request_timeout: 5.0
  max_retry_count: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
